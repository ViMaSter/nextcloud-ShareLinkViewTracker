name: Build and release app

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:packaging
      - run: npm run build
      - name: Package app
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          if [ "$IS_TAG" != true ]; then
            RELEASE_TAG="v$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')"
          fi
          npm run package -- "$RELEASE_TAG"
      - name: Check PHP syntax
        run: |
          find lib templates -name '*.php' -print0 | xargs -0 -n1 php -l
      - uses: actions/upload-artifact@v7
        with:
          name: sharelinkviewtracker
          path: dist/*.tar.gz*
          if-no-files-found: error
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build app artifact image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ghcr.io/vimaster/nextcloud-sharelinkviewtracker:test

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: sharelinkviewtracker
          path: dist
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/vimaster/nextcloud-sharelinkviewtracker:${{ github.ref_name }}
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.tar.gz* --verify-tag --generate-notes